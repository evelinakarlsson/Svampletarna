<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampletarna</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Svampletarna</h1>
        <p>Välkommen till svampletarnas hemsida</p>
    </header>
    <main>
        <div class="login-container">

            <img src="svamp.jpg" alt="Bild på svampar i en korg">
            
            <div class="login-content">
                <form id="loginForm">
                    <h2>Logga in</h2>
                    <label for="namn">Namn:</label>
                    <input type="text" id="namn" name="namn">

                    <label for="losenord">Lösenord:</label>
                    <input type="password" id="losenord" name="losenord">

                    <button type="button" id="loginBtn">Logga in</button>
                </form>

                <p id="message"></p>
                <button type="button" id="logoutBtn">Logga ut</button>
            </div>

        </div>
    </main>

    <footer>
        <p>© Svampletarna 2026</p>
    </footer>
    
</body>
</html>
