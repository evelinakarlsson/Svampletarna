<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampletarna</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Svampletarna</h1>
        <p>Välkommen till svampletarnas hemsida</p>
    </header>
    <main>
        <img src="svamp.jpg" alt="Bild på svampar i en korg">

        <form id="loginForm">
            <label for="namn">Namn:</label>
            <input type="text" id="namn" name="namn">

            <label for="losenord">Lösenord:</label>
            <input type="password" id="losenord" name="losenord">

            <button type="button" id="btn1">Logga in</button>

        </form>
        
        <p id="message"></p>

        <button type="button" id="btn2">Logga ut</button>
        
    </main>

    <footer>
        © Svampletarna 2026
    </footer>
    
</body>
</html>
